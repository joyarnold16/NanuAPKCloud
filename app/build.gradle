plugins { id 'com.android.application' }

android {
    namespace 'com.nanu.aitradingbot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nanu.aitradingbot'
        minSdk 23
        targetSdk 35
        versionCode 29
        versionName '6.8-oco-safety'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('NANU_RELEASE_KEYSTORE_PATH') ?: "${rootDir}/nanu-release.keystore")
            storePassword System.getenv('NANU_RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('NANU_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('NANU_RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
