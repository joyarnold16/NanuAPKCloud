plugins { id 'com.android.application' }

android {
    namespace 'com.nanu.aitradingbot'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nanu.aitradingbot'
        minSdk 23
        targetSdk 35
        versionCode 35
        versionName '10.0-nanu'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('NANU_RELEASE_KEYSTORE_PATH') ?: "${rootDir}/nanu-release.keystore")
            storePassword System.getenv('NANU_RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('NANU_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('NANU_RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.trustwallet:wallet-core:4.0.26'
    implementation 'com.google.zxing:core:3.5.3'
}
