# NANU AI TRADING BOT - FINAL v1 CONFIG
# Default is PAPER MODE. Paper mode never sends real orders.
# Change slowly: paper -> demo -> testnet -> live.

[app]
name = Nanu AI Trading Bot
loop_seconds = 30
web_host = 127.0.0.1
web_port = 8765
data_dir = storage
log_level = INFO

[exchange]
# Options: paper, demo, testnet, live
mode = paper
base_url_live = https://api.binance.com/api
base_url_demo = https://demo-api.binance.com/api
base_url_testnet = https://testnet.binance.vision/api
api_key =
api_secret =
recv_window = 5000
# live mode refuses orders until this is true.
live_trading_enabled = false
# Use MARKET orders for v1 scalping bridge. v2 can add LIMIT-maker mode.
use_market_orders = true

[strategy]
only_scalping = true
symbols = BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
interval = 1m
candle_limit = 120
ema_fast = 9
ema_slow = 21
rsi_period = 14
rsi_buy_min = 45
rsi_buy_max = 68
rsi_sell_min = 72
macd_fast = 12
macd_slow = 26
macd_signal = 9
min_confidence = 64
cooldown_seconds = 120

[risk]
quote_asset = USDT
quote_per_trade = 15
max_open_trades = 2
max_daily_loss_quote = 5
stop_loss_pct = 0.35
take_profit_pct = 0.55
trailing_stop_pct = 0.30
max_hold_minutes = 25
fee_pct = 0.10
min_notional = 5

[telegram]
enabled = false
bot_token =
chat_id =
allowed_user_ids =
alert_on_signal = true
alert_on_trade = true
alert_on_stop = true

[security]
# Keep this true unless you understand local-network exposure.
bind_localhost_only = true
# Optional simple dashboard password. Empty means local-only without password.
dashboard_password =
