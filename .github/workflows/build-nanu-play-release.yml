name: Build Nanu 1.0 Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanu-play-release
  cancel-in-progress: false

jobs:
  play-release:
    name: Build signed Nanu 1.0 Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NANU_REPORT_ENDPOINT: ${{ vars.NANU_REPORT_ENDPOINT }}
      NANU_SUPPORT_EMAIL: ${{ vars.NANU_SUPPORT_EMAIL }}
      NANU_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NANU_UPLOAD_KEYSTORE_BASE64 }}
      NANU_UPLOAD_STORE_PASSWORD: ${{ secrets.NANU_UPLOAD_STORE_PASSWORD }}
      NANU_UPLOAD_KEY_ALIAS: ${{ secrets.NANU_UPLOAD_KEY_ALIAS }}
      NANU_UPLOAD_KEY_PASSWORD: ${{ secrets.NANU_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout Nanu release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android release dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Play release configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NANU_REPORT_ENDPOINT"
          test -n "$NANU_SUPPORT_EMAIL"
          test -n "$NANU_UPLOAD_KEYSTORE_BASE64"
          test -n "$NANU_UPLOAD_STORE_PASSWORD"
          test -n "$NANU_UPLOAD_KEY_ALIAS"
          test -n "$NANU_UPLOAD_KEY_PASSWORD"
          [[ "$NANU_REPORT_ENDPOINT" == https://* ]]
          bash -n nanu-local-ai/ci/build_play_release.sh
          python3 nanu-local-ai/ci/preflight_rc8.py

      - name: Build signed Play release AAB
        shell: bash
        run: bash nanu-local-ai/ci/build_play_release.sh

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: nanu-local-ai-v1.0-play-release
          path: |
            out/nanu-local-ai-v1.0-play-release.aab
            out/PLAY_RELEASE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
