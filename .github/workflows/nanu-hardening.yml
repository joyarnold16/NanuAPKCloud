name: Nanu paper hardening checks
on:
  pull_request:
    paths: ['app/**', 'nas/**', 'tools/test-paper.ps1', '.github/workflows/nanu-hardening.yml']
  push:
    branches: ['harden/**']
    paths: ['app/**', 'nas/**', '.github/workflows/nanu-hardening.yml']
permissions:
  contents: read
  packages: read
jobs:
  verify-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and package portable paper engine
        run: gradle -p nas --no-daemon test installDist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-engine-reports
          path: nas/build/reports/tests
      - uses: android-actions/setup-android@v3
      - name: Test, lint and build Android paper app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanu-android-checks
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
