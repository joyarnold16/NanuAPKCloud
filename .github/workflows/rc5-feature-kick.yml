name: RC5 Build Dispatcher
# refresh: 2026-08-22T11:35+05:30

on:
  push:
    branches:
      - feature/nanu-local-ai-v1
    paths:
      - '.github/workflows/rc5-feature-kick.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Publish latest RC5 build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-nanu-local-ai.yml --branch feature/nanu-local-ai-v1 --limit 10 --json databaseId,headSha,status,conclusion,event,createdAt)
          echo "$RUNS"
          BUILD_ID=$(echo "$RUNS" | jq -r '.[0].databaseId // empty')
          test -n "$BUILD_ID"
          python3 - "$BUILD_ID" <<'PY'
          import json, os, subprocess, sys
          repo = os.environ['GITHUB_REPOSITORY']
          build_id = sys.argv[1]
          raw = subprocess.check_output(['gh','api',f'repos/{repo}/pulls/6'], text=True)
          data = json.loads(raw)
          body = data.get('body') or ''
          marker = '<!-- nanu-rc5-active-run -->'
          lines = [ln for ln in body.splitlines() if marker not in ln]
          body = '\n'.join(lines).rstrip() + f'\n\n{marker} Active RC5 build run: {build_id}'
          subprocess.check_call(['gh','api','--method','PATCH',f'repos/{repo}/pulls/6','-f',f'body={body}'])
          PY
