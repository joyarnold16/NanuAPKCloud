name: Record Nanu RC5 Build Result

on:
  workflow_run:
    workflows:
      - Build Nanu Local AI APK
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'feature/nanu-local-ai-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nanu Local AI feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/nanu-local-ai-v1
          fetch-depth: 0

      - name: Write latest RC5 build pointer
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p .build-status
          cat > .build-status/rc5.txt <<EOF
          run_id=$RUN_ID
          run_number=$RUN_NUMBER
          conclusion=$RUN_CONCLUSION
          head_sha=$RUN_HEAD_SHA
          url=$RUN_URL
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/rc5.txt
          if git diff --cached --quiet; then
            echo "Build pointer already current."
          else
            git commit -m "Record RC5 build result #$RUN_NUMBER"
            git push origin HEAD:feature/nanu-local-ai-v1
          fi
