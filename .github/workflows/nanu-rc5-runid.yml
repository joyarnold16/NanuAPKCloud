name: Nanu RC5 Run ID Recorder

on:
  push:
    branches:
      - feature/nanu-local-ai-v1
    paths:
      - 'nanu-local-ai/RC5_RUNID.txt'

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/nanu-local-ai-v1
          fetch-depth: 0

      - name: Find latest dispatched RC5 build and publish pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-nanu-local-ai.yml/runs?branch=feature%2Fnanu-local-ai-v1&event=workflow_dispatch&per_page=5" \
              > /tmp/runs.json
            python3 - <<'PY' > /tmp/pointer
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/runs.json').read_text())
          runs = d.get('workflow_runs', [])
          if runs:
              r = runs[0]
              print(f"run_id={r['id']}")
              print(f"run_number={r['run_number']}")
              print(f"status={r['status']}")
              print(f"conclusion={r.get('conclusion') or '-'}")
              print(f"head_sha={r['head_sha']}")
          PY
            if [ -s /tmp/pointer ]; then
              mkdir -p .build-status
              cp /tmp/pointer .build-status/rc5-running.txt
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .build-status/rc5-running.txt
              git commit -m "Record active RC5 workflow run" || true
              git push origin HEAD:feature/nanu-local-ai-v1
              cat .build-status/rc5-running.txt
              exit 0
            fi
            sleep 5
          done
          echo "No dispatched RC5 run found"
          exit 1
