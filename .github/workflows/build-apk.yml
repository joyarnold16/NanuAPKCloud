name: Build Nanu AI Trading Bot Professional APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      NANU_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/nanu-release.keystore
      NANU_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NANU_RELEASE_KEYSTORE_PASSWORD }}
      NANU_RELEASE_KEY_ALIAS: ${{ secrets.NANU_RELEASE_KEY_ALIAS }}
      NANU_RELEASE_KEY_PASSWORD: ${{ secrets.NANU_RELEASE_KEY_PASSWORD }}
      RELEASE_TAG: nanu-ai-trading-bot-v6-4-tablet-edition
      APK_NAME: nanu-ai-trading-bot-v6-4-tablet-edition.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Spot order safety regression tests
        working-directory: server
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        env:
          NANU_RELEASE_KEYSTORE_B64: ${{ secrets.NANU_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$NANU_RELEASE_KEYSTORE_B64" || (echo "Missing NANU_RELEASE_KEYSTORE_B64 secret" && exit 1)
          test -n "$NANU_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing NANU_RELEASE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$NANU_RELEASE_KEY_ALIAS" || (echo "Missing NANU_RELEASE_KEY_ALIAS secret" && exit 1)
          test -n "$NANU_RELEASE_KEY_PASSWORD" || (echo "Missing NANU_RELEASE_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$NANU_RELEASE_KEYSTORE_B64" | base64 -d > "$NANU_RELEASE_KEYSTORE_PATH"

      - name: Test, lint, and build signed release APK
        run: gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Prepare APK and release notes
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cat > release-notes.md <<'NOTES'
          Nanu AI Trading Bot v6.4 Tablet Edition

          - No VPS, HTTPS executor URL, or executor control token required
          - Direct encrypted on-device Binance Spot API credentials
          - Four approved pairs: BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT
          - Custom manual order amount and manual order limit; maximum four real BUY entries per day
          - Closed-candle EMA 9/21, RSI, volatility, volume filters, and bounded paper-learning memory
          - Automatic paper positions only; real Spot orders remain typed and manually confirmed
          - A real filled BUY requests a Binance OCO target/stop exit. On an OCO failure, the app attempts an emergency market sell and reports the outcome.
          - App-wide PIN lock, direct Spot portfolio sync, readable dialogs, and tablet rotation support

          No trading app can guarantee profit, prevent every loss, or replace checking Binance order history. Start with Binance Test Order mode and a small amount.
          NOTES
          ls -lh "$APK_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --title "Nanu AI Trading Bot v6.4 Tablet Edition" \
              --notes-file release-notes.md \
              --latest
          fi
