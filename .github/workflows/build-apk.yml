name: Build Nanu God Mode APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nanu source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build God Mode debug APK
        working-directory: mobile_apk
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp mobile_apk/app/build/outputs/apk/debug/app-debug.apk nanu-god-mode-debug.apk
          ls -lh nanu-god-mode-debug.apk

      - name: Delete old God Mode release if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nanu-god-mode --cleanup-tag -y || true
          git push origin :refs/tags/nanu-god-mode || true

      - name: Create God Mode APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nanu-god-mode nanu-god-mode-debug.apk \
            --title "Nanu God Mode APK" \
            --notes "Nanu God Mode safe-edition APK. Paper first; live trading is not guaranteed profit." \
            --latest
