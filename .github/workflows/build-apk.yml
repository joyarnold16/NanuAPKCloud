name: Build Nanu AI Trading Bot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      NANU_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/nanu-release.keystore
      NANU_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NANU_RELEASE_KEYSTORE_PASSWORD }}
      NANU_RELEASE_KEY_ALIAS: ${{ secrets.NANU_RELEASE_KEY_ALIAS }}
      NANU_RELEASE_KEY_PASSWORD: ${{ secrets.NANU_RELEASE_KEY_PASSWORD }}
      RELEASE_TAG: nanu-ai-trading-bot-v6-8-oco-safety
      APK_NAME: nanu-ai-trading-bot-v6-8-oco-safety.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Spot order safety regression tests
        working-directory: server
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        env:
          NANU_RELEASE_KEYSTORE_B64: ${{ secrets.NANU_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$NANU_RELEASE_KEYSTORE_B64" || (echo "Missing NANU_RELEASE_KEYSTORE_B64 secret" && exit 1)
          test -n "$NANU_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing NANU_RELEASE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$NANU_RELEASE_KEY_ALIAS" || (echo "Missing NANU_RELEASE_KEY_ALIAS secret" && exit 1)
          test -n "$NANU_RELEASE_KEY_PASSWORD" || (echo "Missing NANU_RELEASE_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$NANU_RELEASE_KEYSTORE_B64" | base64 -d > "$NANU_RELEASE_KEYSTORE_PATH"

      - name: Test, lint, and build signed release APK
        run: gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Prepare APK and release notes
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cat > release-notes.md <<'NOTES'
          Nanu AI Trading Bot v6.8

          - Direct encrypted on-device Binance Spot API credentials and foreground-service execution
          - Four approved pairs: BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT; one protected open position and four entries per local day
          - Automatic closed-candle scan chooses the highest qualified EMA/RSI setup above the configured confidence threshold
          - Device public-IP controls: show current IP, use it as the expected IP, explicit match check, and a mandatory recheck immediately before every automatic BUY
          - Automatic and manual protected BUYs are blocked below the calculated fee-and-stop-safe Binance notional; automatic protected entries have a 6 USDT minimum
          - OCO price levels are validated against the current Binance price without weakening the configured stop; a price already through the stop invokes the emergency-close path
          - Filled base-asset commissions are removed from the OCO quantity, emergency exits report Binance's exact rejection, and pending automatic BUYs are explicitly blocked from restart
          - Emergency Close cancels only the Nanu-tracked OCO list, never all open orders for that symbol, and can attempt to close a confirmed pending automatic BUY
          - Explicit PANIC state and typed Reset Panic State recovery; automatic LIVE never resumes from Panic and must be armed again
          - Device Readiness report with network, battery-saver, foreground heartbeat, and unexpected device-service-stop alerting
          - Start Scanner, Start Automatic LIVE, Stop, Panic Stop, automatic preflight, emergency-close control, PIN lock, Telegram alerts, and direct Spot portfolio sync
          - Header and Telegram status now agree on IDLE, ACTIVE, and PANIC; all tablet terminology replaced with device

          No trading app can guarantee profit, prevent every loss, or replace checking Binance order history. Keep withdrawals disabled, begin with Binance Test Order mode, then use the smallest valid amount and verify the first Binance OCO exit orders.
          NOTES
          ls -lh "$APK_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --title "Nanu AI Trading Bot v6.8" \
              --notes-file release-notes.md \
              --latest
          fi
