name: Build Nanu AI Trading Bot V5.5 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk nanu-ai-trading-bot-v5-5-debug.apk
          ls -lh nanu-ai-trading-bot-v5-5-debug.apk
      - name: Delete old V5.5 release if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nanu-ai-trading-bot-v5-5 --cleanup-tag -y || true
          git push origin :refs/tags/nanu-ai-trading-bot-v5-5 || true
      - name: Create V5.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nanu-ai-trading-bot-v5-5 nanu-ai-trading-bot-v5-5-debug.apk \
            --title "Nanu AI Trading Bot V5.5" \
            --notes "Final Safety Polish: duplicate API Doctor dialog fixed, withdrawal warning clarified, final live safety checklist, Telegram Doctor status gate, phone alert test, notification permission check, panic-test requirement, and preserved Profit Guard/no-flicker/API Doctor protections." \
            --latest
