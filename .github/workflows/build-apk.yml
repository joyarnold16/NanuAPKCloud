name: Build Nanu AI Trading Bot Professional APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      NANU_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/nanu-release.keystore
      NANU_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NANU_RELEASE_KEYSTORE_PASSWORD }}
      NANU_RELEASE_KEY_ALIAS: ${{ secrets.NANU_RELEASE_KEY_ALIAS }}
      NANU_RELEASE_KEY_PASSWORD: ${{ secrets.NANU_RELEASE_KEY_PASSWORD }}
      RELEASE_TAG: nanu-ai-trading-bot-v6-3-spot-executor
      APK_NAME: nanu-ai-trading-bot-v6-3-spot-executor.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test VPS Spot executor
        working-directory: server
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        env:
          NANU_RELEASE_KEYSTORE_B64: ${{ secrets.NANU_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$NANU_RELEASE_KEYSTORE_B64" || (echo "Missing NANU_RELEASE_KEYSTORE_B64 secret" && exit 1)
          test -n "$NANU_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing NANU_RELEASE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$NANU_RELEASE_KEY_ALIAS" || (echo "Missing NANU_RELEASE_KEY_ALIAS secret" && exit 1)
          test -n "$NANU_RELEASE_KEY_PASSWORD" || (echo "Missing NANU_RELEASE_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$NANU_RELEASE_KEYSTORE_B64" | base64 -d > "$NANU_RELEASE_KEYSTORE_PATH"

      - name: Test, lint, and build signed release APK
        run: gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Prepare APK and release notes
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cat > release-notes.md <<'NOTES'
          Nanu AI Trading Bot v6.3 Spot Executor

          - HTTPS control console for the private VPS execution service
          - App stores only an encrypted control token; Binance API credentials remain on the VPS
          - Four approved Spot pairs, maximum four daily entries, and one open position at a time
          - Configurable automatic USDT amount, stop loss, take profit, daily loss guard, and signal threshold
          - Closed-candle EMA 9/21, RSI, ATR, volume filters, and bounded post-trade learning memory
          - Binance exchange filters, order rate-limit lock, persisted decision journal, and restart recovery
          - Market buy followed by exchange-side SELL OCO target and stop protection, with emergency sell on protection failure
          - Clear readable executor dashboard and secure server controls

          The APK alone does not enable automatic live orders. Deploy and verify the VPS in PAPER mode first. No trading bot can guarantee profit or avoid all market risk.
          NOTES
          ls -lh "$APK_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --title "Nanu AI Trading Bot v6.3 Spot Executor" \
              --notes-file release-notes.md \
              --latest
          fi
