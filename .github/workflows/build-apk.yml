name: Build Nanu Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nanu source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Show project files
        run: |
          pwd
          ls -la
          ls -la mobile_apk

      - name: Build debug APK
        working-directory: mobile_apk
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Check APK output
        run: ls -lh mobile_apk/app/build/outputs/apk/debug/

      - name: Upload Nanu APK
        uses: actions/upload-artifact@v4
        with:
          name: nanu-final-apk
          path: mobile_apk/app/build/outputs/apk/debug/app-debug.apk
