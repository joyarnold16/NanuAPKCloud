name: Build Nanu AI Trading Bot V6.0 Fixed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleRelease --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk nanu-ai-trading-bot-v6-0-fixed.apk
          ls -lh nanu-ai-trading-bot-v6-0-fixed.apk

      - name: Delete old V6.0 release if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nanu-ai-trading-bot-v6-0 --cleanup-tag -y || true
          git push origin :refs/tags/nanu-ai-trading-bot-v6-0 || true
      - name: Create V6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nanu-ai-trading-bot-v6-0 nanu-ai-trading-bot-v6-0-fixed.apk \
            --title "Nanu AI Trading Bot V6.0 Fixed" \
            --notes "Nanu v6.0 Controlled Live Scalping System: Binance Compliance Guard, manual confirmed micro BUY/SELL, test-order mode by default, real micro arming gate, full-auto proof lock, Error Doctor, safe backup export, Telegram status, Profit Guard and Live Face Engine." \
            --latest
