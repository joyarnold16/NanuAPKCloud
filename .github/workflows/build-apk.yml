name: Build Nanu All In One APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk nanu-all-in-one-god-mode-debug.apk
          ls -lh nanu-all-in-one-god-mode-debug.apk

      - name: Delete old release if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nanu-all-in-one --cleanup-tag -y || true
          git push origin :refs/tags/nanu-all-in-one || true

      - name: Create APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nanu-all-in-one nanu-all-in-one-god-mode-debug.apk \
            --title "Nanu All-In-One God Mode APK" \
            --notes "Native Android all-in-one safe edition. Runs without Termux. Paper mode first; no profit guarantee." \
            --latest
