name: Kick Nanu RC5 Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc5-kick.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch RC5 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-nanu-local-ai-main.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "RC5 build dispatched"
