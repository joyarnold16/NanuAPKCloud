name: Nanu RC5 Build Monitor

on:
  push:
    branches:
      - feature/nanu-local-ai-v1
    paths:
      - 'nanu-local-ai/RC5_MONITOR.txt'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/nanu-local-ai-v1
          fetch-depth: 0

      - name: Dispatch final RC5 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-nanu-local-ai.yml/dispatches"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d '{"ref":"feature/nanu-local-ai-v1"}')
          echo "Dispatch HTTP $code"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out || true
            exit 1
          fi
          date -u +%s > /tmp/dispatch_epoch

      - name: Find dispatched build run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-nanu-local-ai.yml/runs?branch=feature%2Fnanu-local-ai-v1&event=workflow_dispatch&per_page=10" \
              > /tmp/runs.json
            python3 - <<'PY' > /tmp/run_id
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/runs.json').read_text())
          runs = data.get('workflow_runs', [])
          if runs:
              print(runs[0]['id'])
          PY
            if [ -s /tmp/run_id ]; then
              RUN_ID=$(cat /tmp/run_id)
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Found RC5 run $RUN_ID"
              exit 0
            fi
            echo "Waiting for dispatched RC5 run ($attempt/30)..."
            sleep 5
          done
          echo "Could not find dispatched RC5 run"
          exit 1

      - name: Wait for RC5 completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              > /tmp/run.json
            read -r STATUS CONCLUSION RUN_NUMBER HEAD_SHA <<< "$(python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/run.json').read_text())
          print(d.get('status',''), d.get('conclusion') or '-', d.get('run_number',''), d.get('head_sha',''))
          PY
          )"
            echo "RC5 run #$RUN_NUMBER: $STATUS / $CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              mkdir -p .build-status
              cat > .build-status/rc5.txt <<EOF
          run_id=$RUN_ID
          run_number=$RUN_NUMBER
          conclusion=$CONCLUSION
          head_sha=$HEAD_SHA
          EOF
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .build-status/rc5.txt
              git commit -m "Record RC5 build result #$RUN_NUMBER" || true
              git push origin HEAD:feature/nanu-local-ai-v1
              if [ "$CONCLUSION" != "success" ]; then
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for RC5 build"
          exit 1
