name: Publish docs to GitHub Pages

# The privacy policy at docs/privacy-policy.html has to be reachable at a public
# URL before Google Play will accept the listing.
#
# Settings > Pages offers two sources. "Deploy from a branch" makes GitHub create
# and run a pages-build-deployment workflow for you. "GitHub Actions" does not -
# it expects the repository to supply its own deploy workflow, and with no such
# workflow present nothing is ever published and every URL returns 404 with no
# error shown anywhere in the UI. This is that workflow.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let the running one land first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on with the Actions source if it is off or set
        # to a branch, so this works without a second trip to the settings page.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report the published URLs
        run: |
          base="${{ steps.deploy.outputs.page_url }}"
          echo "Site: $base"
          echo "Privacy policy (paste this into Play Console):"
          echo "  ${base%/}/privacy-policy.html"
