name: Build ROR COLREG APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Nanu ROR Visual Deck APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ror-colreg
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp ror-colreg/app/build/outputs/apk/debug/app-debug.apk ROR-Visual-Deck-v4.1.apk
          sha256sum ROR-Visual-Deck-v4.1.apk
          ls -lh ROR-Visual-Deck-v4.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v4.1-APK
          path: ROR-Visual-Deck-v4.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-v4.1-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v4.1.apk \
            --title "Nanu ROR Visual Deck v4.1" \
            --notes "Offline Android APK for COLREG/ROR training: 41 rules, lights and shapes, sound signals, IALA, a vessel-type/day-night bridge simulator with live give-way/stand-on verdicts, favourites, printable completion certificate, exam question bank, and a freemium in-app purchase unlocking the Encounter Lab, Oral Practice, and Exam Mode. v4.1 fixes the in-app purchase failure paths, all of which were silent. A failed billing setup was swallowed whole: no message, no retry, and a client that stayed dead for the life of the process, so the paywall showed an empty price box forever with nothing for the buyer to act on. A product query that returned no product - the usual symptom of a product ID that does not match Play Console, an inactive product, or a build not installed from Play - was equally silent. Both now report a specific reason in place of the price, and retry only where retrying can help. Tapping Unlock used to answer 'store connection not ready, try again in a moment' regardless of cause, sending buyers after a network problem that was really a store configuration one; it now repeats the real reason. ITEM_ALREADY_OWNED, which is what Play returns after a reinstall on the same account, was reported as a failed purchase to someone who had already paid; it now re-queries and restores the entitlement. Restore that finds nothing now says so instead of appearing to do nothing, and calling Restore on a live connection re-queries rather than tearing down a working client. v4.1 also fixes the release signing setup script, which could never have worked: it generated its password by piping /dev/urandom into 'head -c 32', so tr died of SIGPIPE and, under 'set -euo pipefail', the script exited on that line every time - before generating a key and before uploading a single secret, printing no error. It now reads a fixed number of bytes, verifies the keystore opens with the password it just set, byte-compares the base64 round-trip, confirms the authenticated account is a repo admin before doing anything, and reads the secrets back to prove all four landed at repository scope. The workflow's secret check now names each missing secret rather than reporting a single boolean. This is a debug-signed testing build (premium auto-unlocked for testing); a Play Store upload requires a release-signed AAB." \
            --latest

  verify-release-build:
    name: Verify release AAB compiles (throwaway key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The real release job only runs once the signing secrets exist, which means the
    # release build path can sit broken and unnoticed. This job compiles bundleRelease
    # on every run against a disposable key so a breakage surfaces here rather than
    # after someone has set up their keystore. Its output is never uploaded or
    # published: an AAB signed with this key is worthless and must not reach Play.
    env:
      ROR_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/throwaway-ci.keystore
      ROR_RELEASE_KEYSTORE_PASSWORD: throwaway
      ROR_RELEASE_KEY_ALIAS: throwaway
      ROR_RELEASE_KEY_PASSWORD: throwaway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate a disposable signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$ROR_RELEASE_KEYSTORE_PATH" \
            -alias "$ROR_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$ROR_RELEASE_KEYSTORE_PASSWORD" \
            -keypass "$ROR_RELEASE_KEY_PASSWORD" \
            -dname "CN=throwaway-ci, OU=ci, O=ci, L=ci, ST=ci, C=GB"

      - name: Build release AAB
        working-directory: ror-colreg
        run: gradle --no-daemon clean bundleRelease --stacktrace

      - name: Report bundle and discard
        run: |
          ls -lh ror-colreg/app/build/outputs/bundle/release/app-release.aab
          echo "Release build path is sound."
          echo "This bundle is signed with a disposable CI key and is deliberately not uploaded."
          rm -f "$ROR_RELEASE_KEYSTORE_PATH" ror-colreg/app/build/outputs/bundle/release/app-release.aab

  check-release-secret:
    name: Check for release signing secrets
    runs-on: ubuntu-latest
    # Also runs on workflow_dispatch so the release bundle can be re-triggered
    # from the Actions tab after adding or rotating the signing secrets,
    # without having to invent a commit to push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      has_secret: ${{ steps.check.outputs.has_secret }}
    steps:
      - name: Check whether the release signing secrets are set
        id: check
        env:
          ROR_RELEASE_KEYSTORE_B64: ${{ secrets.ROR_RELEASE_KEYSTORE_B64 }}
          ROR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ROR_RELEASE_KEYSTORE_PASSWORD }}
          ROR_RELEASE_KEY_ALIAS: ${{ secrets.ROR_RELEASE_KEY_ALIAS }}
          ROR_RELEASE_KEY_PASSWORD: ${{ secrets.ROR_RELEASE_KEY_PASSWORD }}
        run: |
          # Reports presence only - never a value, never a length. Knowing that three
          # of four landed is the difference between "the script failed" and "the
          # secrets went to the wrong scope", and the old single-secret gate could
          # tell those apart only by guesswork.
          missing=0
          for name in ROR_RELEASE_KEYSTORE_B64 ROR_RELEASE_KEYSTORE_PASSWORD \
                      ROR_RELEASE_KEY_ALIAS ROR_RELEASE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              echo "  present : $name"
            else
              echo "  MISSING : $name"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "All four signing secrets are visible to Actions."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo
            echo "$missing of 4 signing secrets are not visible to this workflow."
            echo "The signed .aab job will be skipped."
            echo
            if [ "$missing" -eq 4 ]; then
              echo "None are visible at all. The usual causes, in order of likelihood:"
              echo "  1. They were added under Settings > Secrets and variables >"
              echo "     Actions > *Environment secrets* rather than *Repository"
              echo "     secrets*. Environment secrets only reach a job that declares"
              echo "     that environment, and no job here does."
              echo "  2. They were added under *Dependabot* secrets, which Actions"
              echo "     cannot read."
              echo "  3. gh was authenticated to a different account, so they landed"
              echo "     on a fork or another repository of the same name."
              echo "Run 'gh secret list --repo joyarnold16/NanuAPKCloud' to see what"
              echo "actually exists at repository scope."
            fi
          fi

  build-release-bundle:
    name: Build signed release AAB for Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-release-secret
    if: needs.check-release-secret.outputs.has_secret == 'true'
    env:
      ROR_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/ror-release.keystore
      ROR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ROR_RELEASE_KEYSTORE_PASSWORD }}
      ROR_RELEASE_KEY_ALIAS: ${{ secrets.ROR_RELEASE_KEY_ALIAS }}
      ROR_RELEASE_KEY_PASSWORD: ${{ secrets.ROR_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        env:
          ROR_RELEASE_KEYSTORE_B64: ${{ secrets.ROR_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$ROR_RELEASE_KEYSTORE_B64" || (echo "Missing ROR_RELEASE_KEYSTORE_B64 secret" && exit 1)
          test -n "$ROR_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing ROR_RELEASE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ROR_RELEASE_KEY_ALIAS" || (echo "Missing ROR_RELEASE_KEY_ALIAS secret" && exit 1)
          test -n "$ROR_RELEASE_KEY_PASSWORD" || (echo "Missing ROR_RELEASE_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$ROR_RELEASE_KEYSTORE_B64" | base64 -d > "$ROR_RELEASE_KEYSTORE_PATH"

      - name: Build signed release AAB
        working-directory: ror-colreg
        run: gradle --no-daemon clean bundleRelease --stacktrace

      - name: Prepare AAB
        run: |
          cp ror-colreg/app/build/outputs/bundle/release/app-release.aab ROR-Visual-Deck-v4.1.aab
          sha256sum ROR-Visual-Deck-v4.1.aab
          ls -lh ROR-Visual-Deck-v4.1.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v4.1-AAB
          path: ROR-Visual-Deck-v4.1.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-release-v4.1-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v4.1.aab \
            --title "Nanu ROR Visual Deck v4.1 (Play Store bundle)" \
            --notes "Signed Android App Bundle (.aab) for Google Play Console upload. Not for direct installation on a device — use the debug APK from the other workflow run for that." \
            --latest=false
