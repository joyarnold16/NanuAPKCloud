name: Build ROR COLREG APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Nanu ROR Visual Deck APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ror-colreg
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp ror-colreg/app/build/outputs/apk/debug/app-debug.apk ROR-Visual-Deck-v4.3.apk
          sha256sum ROR-Visual-Deck-v4.3.apk
          ls -lh ROR-Visual-Deck-v4.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v4.3-APK
          path: ROR-Visual-Deck-v4.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-v4.3-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v4.3.apk \
            --title "Nanu ROR Visual Deck v4.3" \
            --notes "Offline Android APK for COLREG/ROR training: 41 rules, lights and shapes, sound signals, IALA, a vessel-type/day-night bridge simulator with live give-way/stand-on verdicts, favourites, printable completion certificate, exam question bank, and a freemium in-app purchase unlocking the Encounter Lab, Oral Practice, and Exam Mode. v4.3 corrects a store-facing string and replaces the Play Store screenshots. The home screen described the app as a PWA, left over from its origin as a web app; it is a native Android app on Play, so the stat now reads No account needed, which is both true and worth saying. The four phone screenshots dated from before the rename and sold the app poorly: the Encounter Lab was represented by a page of sliders rather than the radar plot, and Lights and Shapes by a list rather than a rendered night aspect. All four are regenerated from the current build by test/screenshots.js, which is committed so they can be refreshed rather than recaptured by hand. The Encounter Lab shot now sets up a starboard crossing inside the plot scale, showing the relative-motion vector, the CPA point and live CPA/TCPA readouts, because the default head-on at 10.8 NM pins both vessels to the rim and leaves the plot looking empty. Lights and Shapes shows the rendered masthead and sidelights under its rule heading. Sound and Light shows the pinned sequence panel mid-playback. Capturing these needed two workarounds worth recording: headless Chromium renders the top bar backdrop filter over scrolled content as a white band instead of a blur, and the app scrolls smoothly, so a measurement taken straight after scrollTo still reports the pre-scroll position and every candidate frame looks clean. Both are neutralised for the capture only. This is a debug-signed testing build (premium auto-unlocked for testing); a Play Store upload requires a release-signed AAB." \
            --latest

  verify-release-build:
    name: Verify release AAB compiles (throwaway key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The real release job only runs once the signing secrets exist, which means the
    # release build path can sit broken and unnoticed. This job compiles bundleRelease
    # on every run against a disposable key so a breakage surfaces here rather than
    # after someone has set up their keystore. Its output is never uploaded or
    # published: an AAB signed with this key is worthless and must not reach Play.
    env:
      ROR_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/throwaway-ci.keystore
      ROR_RELEASE_KEYSTORE_PASSWORD: throwaway
      ROR_RELEASE_KEY_ALIAS: throwaway
      ROR_RELEASE_KEY_PASSWORD: throwaway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate a disposable signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$ROR_RELEASE_KEYSTORE_PATH" \
            -alias "$ROR_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$ROR_RELEASE_KEYSTORE_PASSWORD" \
            -keypass "$ROR_RELEASE_KEY_PASSWORD" \
            -dname "CN=throwaway-ci, OU=ci, O=ci, L=ci, ST=ci, C=GB"

      - name: Build release AAB
        working-directory: ror-colreg
        run: gradle --no-daemon clean bundleRelease --stacktrace

      - name: Inspect the release bundle
        working-directory: ror-colreg
        run: |
          # Compiling proves the build works. It does not prove the bundle
          # contains what is supposed to ship, and the release artifact is the
          # one nobody opens until Play rejects it.
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          WORK="$RUNNER_TEMP/aab"
          rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$AAB" -d "$WORK"

          fail=0
          ok()  { echo "  ok   $1"; }
          bad() { echo "  FAIL $1"; fail=1; }

          # The web app is the product. Confirm the bundle ships the file that
          # is in git rather than a stale copy from an earlier build.
          if cmp -s app/src/main/assets/index.html "$WORK/base/assets/index.html"; then
            ok "assets/index.html matches the source tree"
          else
            bad "assets/index.html in the bundle differs from the source tree"
          fi

          # A paywall whose product id did not ship can never show a price.
          if grep -qa ror_premium_unlock "$WORK"/base/dex/classes*.dex; then
            ok "billing product id ror_premium_unlock is present"
          else
            bad "ror_premium_unlock is in no dex in the bundle"
          fi

          # premium_unlocked caches a Play entitlement. Carried in a backup it
          # unlocks the app on an account that never bought it.
          backup_rules="$(find "$WORK/base/res" -name '*backup_rules*')"
          extract_rules="$(find "$WORK/base/res" -name '*data_extraction_rules*')"
          if [ -n "$backup_rules" ] && [ -n "$extract_rules" ]; then
            ok "backup exclusion rules are packaged"
          else
            bad "backup exclusion rules are missing from the bundle"
          fi

          # Signing this with a throwaway key is the only reason the key exists.
          # Not by jarsigner's exit code: it returns 0 for a completely unsigned
          # jar and 4 for a correctly signed one whose self-signed chain it will
          # not vouch for, which is exactly backwards here. Check the signature
          # block is present and that jarsigner says it verified.
          sigblock="$(find "$WORK/META-INF" -maxdepth 1 \
                      \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \) 2>/dev/null)"
          if [ -n "$sigblock" ] && jarsigner -verify "$AAB" 2>/dev/null | grep -q 'jar verified'; then
            ok "bundle carries a valid signature"
          else
            bad "bundle is not signed, or its signature does not verify"
          fi

          echo
          if [ "$fail" -ne 0 ]; then
            echo "The release bundle is not shippable. See the FAIL lines above."
            exit 1
          fi
          echo "Release build path is sound."
          echo "This bundle is signed with a disposable CI key and is deliberately not uploaded."

      - name: Discard the disposable key and bundle
        if: always()
        run: |
          rm -rf "$ROR_RELEASE_KEYSTORE_PATH" \
                 ror-colreg/app/build/outputs/bundle/release/app-release.aab \
                 "$RUNNER_TEMP/aab"

  check-release-secret:
    name: Check for release signing secrets
    runs-on: ubuntu-latest
    # Also runs on workflow_dispatch so the release bundle can be re-triggered
    # from the Actions tab after adding or rotating the signing secrets,
    # without having to invent a commit to push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      has_secret: ${{ steps.check.outputs.has_secret }}
    steps:
      - name: Check whether the release signing secrets are set
        id: check
        env:
          ROR_RELEASE_KEYSTORE_B64: ${{ secrets.ROR_RELEASE_KEYSTORE_B64 }}
          ROR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ROR_RELEASE_KEYSTORE_PASSWORD }}
          ROR_RELEASE_KEY_ALIAS: ${{ secrets.ROR_RELEASE_KEY_ALIAS }}
          ROR_RELEASE_KEY_PASSWORD: ${{ secrets.ROR_RELEASE_KEY_PASSWORD }}
        run: |
          # Reports presence only - never a value, never a length. Knowing that three
          # of four landed is the difference between "the script failed" and "the
          # secrets went to the wrong scope", and the old single-secret gate could
          # tell those apart only by guesswork.
          missing=0
          for name in ROR_RELEASE_KEYSTORE_B64 ROR_RELEASE_KEYSTORE_PASSWORD \
                      ROR_RELEASE_KEY_ALIAS ROR_RELEASE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              echo "  present : $name"
            else
              echo "  MISSING : $name"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "All four signing secrets are visible to Actions."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo
            echo "$missing of 4 signing secrets are not visible to this workflow."
            echo "The signed .aab job will be skipped."
            echo
            if [ "$missing" -eq 4 ]; then
              echo "None are visible at all. The usual causes, in order of likelihood:"
              echo "  1. They were added under Settings > Secrets and variables >"
              echo "     Actions > *Environment secrets* rather than *Repository"
              echo "     secrets*. Environment secrets only reach a job that declares"
              echo "     that environment, and no job here does."
              echo "  2. They were added under *Dependabot* secrets, which Actions"
              echo "     cannot read."
              echo "  3. gh was authenticated to a different account, so they landed"
              echo "     on a fork or another repository of the same name."
              echo "Run 'gh secret list --repo joyarnold16/NanuAPKCloud' to see what"
              echo "actually exists at repository scope."
            fi
          fi

  build-release-bundle:
    name: Build signed release AAB for Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-release-secret
    if: needs.check-release-secret.outputs.has_secret == 'true'
    env:
      ROR_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/ror-release.keystore
      ROR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ROR_RELEASE_KEYSTORE_PASSWORD }}
      ROR_RELEASE_KEY_ALIAS: ${{ secrets.ROR_RELEASE_KEY_ALIAS }}
      ROR_RELEASE_KEY_PASSWORD: ${{ secrets.ROR_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        env:
          ROR_RELEASE_KEYSTORE_B64: ${{ secrets.ROR_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$ROR_RELEASE_KEYSTORE_B64" || (echo "Missing ROR_RELEASE_KEYSTORE_B64 secret" && exit 1)
          test -n "$ROR_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing ROR_RELEASE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ROR_RELEASE_KEY_ALIAS" || (echo "Missing ROR_RELEASE_KEY_ALIAS secret" && exit 1)
          test -n "$ROR_RELEASE_KEY_PASSWORD" || (echo "Missing ROR_RELEASE_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$ROR_RELEASE_KEYSTORE_B64" | base64 -d > "$ROR_RELEASE_KEYSTORE_PATH"

      - name: Build signed release AAB
        working-directory: ror-colreg
        run: gradle --no-daemon clean bundleRelease --stacktrace

      - name: Prepare AAB
        run: |
          cp ror-colreg/app/build/outputs/bundle/release/app-release.aab ROR-Visual-Deck-v4.3.aab
          sha256sum ROR-Visual-Deck-v4.3.aab
          ls -lh ROR-Visual-Deck-v4.3.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v4.3-AAB
          path: ROR-Visual-Deck-v4.3.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-release-v4.3-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v4.3.aab \
            --title "Nanu ROR Visual Deck v4.3 (Play Store bundle)" \
            --notes "Signed Android App Bundle (.aab) for Google Play Console upload. Not for direct installation on a device — use the debug APK from the other workflow run for that." \
            --latest=false
