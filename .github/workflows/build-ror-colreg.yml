name: Build ROR COLREG APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ROR Visual Deck APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ror-colreg
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp ror-colreg/app/build/outputs/apk/debug/app-debug.apk ROR-Visual-Deck-v3.8.apk
          sha256sum ROR-Visual-Deck-v3.8.apk
          ls -lh ROR-Visual-Deck-v3.8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v3.8-APK
          path: ROR-Visual-Deck-v3.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-v3.8-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v3.8.apk \
            --title "ROR Visual Deck v3.8" \
            --notes "Offline Android APK for COLREG/ROR training: 41 rules, lights and shapes, sound signals, IALA, a vessel-type/day-night bridge simulator with live give-way/stand-on verdicts, favourites, printable completion certificate, exam question bank, and a freemium in-app purchase unlocking the Encounter Lab, Oral Practice, and Exam Mode. v3.8 resynchronises the sound signal player with its timeline. The playhead and flash lamp are now driven from the Web Audio clock rather than the wall clock and are offset by the output latency, so the cursor follows what is audible instead of what has merely been scheduled; playback also waits for the AudioContext to actually resume, which on Android leaves the audio clock frozen and previously let the cursor run ahead of the sound. The timeline length now ends at the last blast instead of overshooting it by the trailing inter-blast gap. v3.8 also targets Android 16 (API 36), which Google Play requires for new app submissions from 31 Aug 2026; this moves AGP to 8.13.0 and Gradle to 8.13 because AGP 8.7.x cannot compile against API 36. This is a debug-signed testing build (premium auto-unlocked for testing); a Play Store upload requires a release-signed AAB." \
            --latest

  verify-release-build:
    name: Verify release AAB compiles (throwaway key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The real release job only runs once the signing secrets exist, which means the
    # release build path can sit broken and unnoticed. This job compiles bundleRelease
    # on every run against a disposable key so a breakage surfaces here rather than
    # after someone has set up their keystore. Its output is never uploaded or
    # published: an AAB signed with this key is worthless and must not reach Play.
    env:
      ROR_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/throwaway-ci.keystore
      ROR_RELEASE_KEYSTORE_PASSWORD: throwaway
      ROR_RELEASE_KEY_ALIAS: throwaway
      ROR_RELEASE_KEY_PASSWORD: throwaway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate a disposable signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$ROR_RELEASE_KEYSTORE_PATH" \
            -alias "$ROR_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$ROR_RELEASE_KEYSTORE_PASSWORD" \
            -keypass "$ROR_RELEASE_KEY_PASSWORD" \
            -dname "CN=throwaway-ci, OU=ci, O=ci, L=ci, ST=ci, C=GB"

      - name: Build release AAB
        working-directory: ror-colreg
        run: gradle --no-daemon clean bundleRelease --stacktrace

      - name: Report bundle and discard
        run: |
          ls -lh ror-colreg/app/build/outputs/bundle/release/app-release.aab
          echo "Release build path is sound."
          echo "This bundle is signed with a disposable CI key and is deliberately not uploaded."
          rm -f "$ROR_RELEASE_KEYSTORE_PATH" ror-colreg/app/build/outputs/bundle/release/app-release.aab

  check-release-secret:
    name: Check for release signing secret
    runs-on: ubuntu-latest
    # Also runs on workflow_dispatch so the release bundle can be re-triggered
    # from the Actions tab after adding or rotating the signing secrets,
    # without having to invent a commit to push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      has_secret: ${{ steps.check.outputs.has_secret }}
    steps:
      - name: Check whether ROR_RELEASE_KEYSTORE_B64 is set
        id: check
        env:
          ROR_RELEASE_KEYSTORE_B64: ${{ secrets.ROR_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$ROR_RELEASE_KEYSTORE_B64" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

  build-release-bundle:
    name: Build signed release AAB for Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-release-secret
    if: needs.check-release-secret.outputs.has_secret == 'true'
    env:
      ROR_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/ror-release.keystore
      ROR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ROR_RELEASE_KEYSTORE_PASSWORD }}
      ROR_RELEASE_KEY_ALIAS: ${{ secrets.ROR_RELEASE_KEY_ALIAS }}
      ROR_RELEASE_KEY_PASSWORD: ${{ secrets.ROR_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        env:
          ROR_RELEASE_KEYSTORE_B64: ${{ secrets.ROR_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$ROR_RELEASE_KEYSTORE_B64" || (echo "Missing ROR_RELEASE_KEYSTORE_B64 secret" && exit 1)
          test -n "$ROR_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing ROR_RELEASE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ROR_RELEASE_KEY_ALIAS" || (echo "Missing ROR_RELEASE_KEY_ALIAS secret" && exit 1)
          test -n "$ROR_RELEASE_KEY_PASSWORD" || (echo "Missing ROR_RELEASE_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$ROR_RELEASE_KEYSTORE_B64" | base64 -d > "$ROR_RELEASE_KEYSTORE_PATH"

      - name: Build signed release AAB
        working-directory: ror-colreg
        run: gradle --no-daemon clean bundleRelease --stacktrace

      - name: Prepare AAB
        run: |
          cp ror-colreg/app/build/outputs/bundle/release/app-release.aab ROR-Visual-Deck-v3.8.aab
          sha256sum ROR-Visual-Deck-v3.8.aab
          ls -lh ROR-Visual-Deck-v3.8.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v3.8-AAB
          path: ROR-Visual-Deck-v3.8.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-release-v3.8-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v3.8.aab \
            --title "ROR Visual Deck v3.8 (Play Store bundle)" \
            --notes "Signed Android App Bundle (.aab) for Google Play Console upload. Not for direct installation on a device — use the debug APK from the other workflow run for that." \
            --latest=false
