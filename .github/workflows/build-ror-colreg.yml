name: Build ROR COLREG APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ror-colreg/**'
      - '.github/workflows/build-ror-colreg.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ROR Visual Deck APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ror-colreg
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp ror-colreg/app/build/outputs/apk/debug/app-debug.apk ROR-Visual-Deck-v3.1.apk
          sha256sum ROR-Visual-Deck-v3.1.apk
          ls -lh ROR-Visual-Deck-v3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROR-Visual-Deck-v3.1-APK
          path: ROR-Visual-Deck-v3.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ror-visual-deck-v3.1-${{ github.run_number }}"
          gh release create "$TAG" ROR-Visual-Deck-v3.1.apk \
            --title "ROR Visual Deck v3.1" \
            --notes "Offline Android APK for COLREG/ROR training. Includes the V3.1 rules, lights and shapes, sound signals, IALA, simulator, exercises and exam question bank. This is a debug-signed testing build; a Play Store upload requires a release-signed AAB." \
            --latest
