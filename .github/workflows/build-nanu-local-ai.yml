name: Build Nanu Local AI RC5

on:
  push:
    branches:
      - feature/nanu-local-ai-v1
    paths:
      - 'nanu-local-ai/**'
      - '.github/workflows/build-nanu-local-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nanu Local AI 1.0 RC5
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Nanu project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build and validate RC5
        run: bash nanu-local-ai/ci/build_rc5.sh

      - name: Upload RC5 APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: nanu-local-ai-v1.0-rc5
          path: out/*
          if-no-files-found: error
          retention-days: 14
