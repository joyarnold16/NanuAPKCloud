name: Build Nanu Local AI APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit containing the Nanu Local AI source'
        required: true
        default: 'feature/nanu-local-ai-v1'
        type: string
  pull_request:
    branches:
      - main
    paths:
      - 'nanu-local-ai/**'

permissions:
  contents: read

concurrency:
  group: nanu-local-ai-rc8-${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Preflight and build Nanu Local AI 1.0 RC8
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout requested Nanu source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Static RC8 preflight
        shell: bash
        run: |
          set -euo pipefail
          bash -n nanu-local-ai/ci/build_rc8.sh
          python3 nanu-local-ai/ci/preflight_rc8.py

      - name: Build and validate RC8
        shell: bash
        run: bash nanu-local-ai/ci/build_rc8.sh

      - name: Upload RC8 APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: nanu-local-ai-v1.0-rc8
          path: out/*
          if-no-files-found: error
          retention-days: 14
