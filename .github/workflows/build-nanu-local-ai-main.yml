name: Build Nanu Local AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-nanu-local-ai-main.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'nanu-local-ai/**'
      - '.github/workflows/build-nanu-local-ai.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Nanu Local AI 1.0 RC5
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Publish active RC5 run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          raw = subprocess.check_output(['gh','api',f'repos/{repo}/pulls/6'], text=True)
          data = json.loads(raw)
          body = data.get('body') or ''
          marker = '<!-- nanu-rc5-active-run -->'
          lines = [ln for ln in body.splitlines() if marker not in ln]
          body = '\n'.join(lines).rstrip() + f'\n\n{marker} Active RC5 build run: {run_id}'
          subprocess.check_call(['gh','api','--method','PATCH',f'repos/{repo}/pulls/6','-f',f'body={body}'])
          print(f'Published RC5 run ID {run_id}')
          PY

      - name: Checkout Nanu Local AI source branch
        uses: actions/checkout@v4
        with:
          ref: feature/nanu-local-ai-v1
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build and validate RC5
        run: bash nanu-local-ai/ci/build_rc5.sh

      - name: Upload RC5 APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: nanu-local-ai-v1.0-rc5
          path: out/*
          if-no-files-found: error
          retention-days: 14
