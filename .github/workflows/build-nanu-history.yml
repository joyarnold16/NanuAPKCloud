name: Validate Nanu background and history

on:
  pull_request:
    branches: [feature/nanu-local-ai-v1]
    paths:
      - 'nanu-local-ai/**'
      - '.github/workflows/build-nanu-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanu-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Preflight and build Nanu Local AI 1.0 RC8
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RC8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build binutils
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Static RC8 preflight
        shell: bash
        run: |
          set -euo pipefail
          bash -n nanu-local-ai/ci/build_rc8.sh
          python3 nanu-local-ai/ci/preflight_rc8.py
          python3 nanu-local-ai/ci/preflight_play_release.py

      - name: Build and validate RC8
        shell: bash
        run: |
          set -euo pipefail
          bash nanu-local-ai/ci/build_rc8.sh
          python3 nanu-local-ai/ci/verify_16k_native.py out/nanu-local-ai-v1.0-rc8.apk
          python3 nanu-local-ai/ci/verify_16k_native.py out/nanu-local-ai-v1.0-rc8-debug.aab

      - name: Upload RC8 APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: nanu-local-ai-background-history
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-unit-tests
          path: llama-upstream/examples/llama.android/app/build/reports/tests/
          if-no-files-found: warn
