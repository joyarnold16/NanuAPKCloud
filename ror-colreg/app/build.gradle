plugins { id 'com.android.application' }

android {
    namespace 'com.joyarnold.rorvisualdeck'
    compileSdk 36

    defaultConfig {
        applicationId 'com.joyarnold.rorvisualdeck'
        minSdk 23
        targetSdk 36
        versionCode 45
        versionName '4.5'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ROR_RELEASE_KEYSTORE_PATH') ?: "${rootDir}/ror-release.keystore")
            storePassword System.getenv('ROR_RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ROR_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('ROR_RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    // Play Console rejects a release built against Billing 7.x: from 2026 it
    // requires 8.0.0 or later. 8.3.0 is the newest 8.x; 9.x exists but brings
    // further API churn for no benefit here.
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'androidx.core:core:1.13.1'

    // Declared only to raise what Play Billing drags in. Billing 7.1.1 resolves
    // androidx.fragment to 1.1.0 and androidx.activity to 1.2.3 - both from 2019
    // to 2021 - and Play Console flags the fragment one as an outdated SDK.
    // Nothing here uses fragments directly; the app is a single Activity hosting
    // a WebView. These pins exist purely so the shipped bundle stops carrying
    // six-year-old transitive code.
    //
    // Held at 1.6.2 / 1.8.2 rather than the newest available because
    // kotlin-stdlib is forced to 1.8.22 above: fragment 1.8.x is built against
    // Kotlin 1.9 and would fight that pin. Raising both together is a larger
    // change than an SDK warning justifies.
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.activity:activity:1.8.2'
}
