plugins { id 'com.android.application' }

android {
    namespace 'com.joyarnold.rorvisualdeck'
    compileSdk 36

    defaultConfig {
        applicationId 'com.joyarnold.rorvisualdeck'
        minSdk 23
        targetSdk 36
        versionCode 41
        versionName '4.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ROR_RELEASE_KEYSTORE_PATH') ?: "${rootDir}/ror-release.keystore")
            storePassword System.getenv('ROR_RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ROR_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('ROR_RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'androidx.core:core:1.13.1'
}
